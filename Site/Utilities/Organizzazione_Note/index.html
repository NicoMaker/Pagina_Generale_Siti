<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organizzazione Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="header-content">
          <div class="logo-section">
            <span class="logo-mark" aria-hidden="true">§</span>
            <h1>Organizzazione Note</h1>
          </div>
          <button
            id="theme-toggle"
            class="theme-btn"
            aria-label="Cambia tema"
            title="Cambia tema"
          >
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="4.2" />
              <path
                d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"
              />
            </svg>
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" />
            </svg>
          </button>
        </div>
        <div class="search-container">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Cerca titolo, contenuto o tag…"
          />
        </div>
      </header>

      <main class="app-content">
        <aside class="sidebar">
          <h2>Categorie</h2>
          <div id="tag-list"></div>
        </aside>

        <section class="notes-container">
          <div class="notes-header">
            <div class="notes-heading">
              <span class="eyebrow">Spazio di lavoro</span>
              <h2>Le tue note</h2>
            </div>
            <div class="notes-actions">
              <button id="add-note-btn" class="primary-button">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                <span>Nuova nota</span>
              </button>

              <div class="delete-dropdown">
                <button
                  class="dropdown-toggle danger-toggle"
                  id="delete-dropdown-btn"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path
                      d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-8 0 1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"
                    />
                  </svg>
                  <span>Elimina</span>
                  <svg
                    class="chevron"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <div class="dropdown-menu" id="delete-menu">
                  <div class="dropdown-item danger" data-action="delete-all">
                    <span>🗑️</span>
                    <span>Elimina tutte le note</span>
                  </div>
                  <div
                    class="dropdown-item danger"
                    data-action="delete-all-completed"
                  >
                    <span>✅</span>
                    <span>Elimina tutte le complete</span>
                  </div>
                  <div
                    class="dropdown-item danger"
                    data-action="delete-filtered"
                  >
                    <span>🔍</span>
                    <span>Elimina note filtrate</span>
                  </div>
                  <div
                    class="dropdown-item danger"
                    data-action="delete-filtered-completed"
                  >
                    <span>🎯</span>
                    <span>Elimina complete filtrate</span>
                  </div>
                </div>
              </div>

              <div class="delete-dropdown">
                <button
                  class="dropdown-toggle data-toggle"
                  id="data-dropdown-btn"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5" />
                  </svg>
                  <span>Dati</span>
                  <svg
                    class="chevron"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <div class="dropdown-menu" id="data-menu">
                  <label for="import-file-input" class="dropdown-item">
                    <span>📥</span>
                    <span>Importa note da file</span>
                    <input
                      type="file"
                      id="import-file-input"
                      accept=".json, .txt"
                      style="display: none"
                    />
                  </label>
                  <div class="dropdown-item" id="export-json-btn">
                    <span>📤</span>
                    <span>Esporta in JSON</span>
                  </div>
                  <div class="dropdown-item" id="export-txt-btn">
                    <span>📄</span>
                    <span>Esporta in TXT</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="notes-summary-card" class="summary-card hidden">
            <div id="summary-text" class="summary-text"></div>
            <div class="progress-bar-container">
              <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <span id="progress-emoji" class="progress-emoji"></span>
            </div>
          </div>

          <div id="notes-grid" class="notes-grid"></div>
        </section>
      </main>

      <div id="modal-overlay" class="modal-overlay"></div>

      <div id="note-modal" class="modal">
        <div class="modal-inner">
          <h3 id="modal-title">Aggiungi nota</h3>
          <div class="modal-body">
            <input type="text" id="note-title" placeholder="Titolo…" />
            <textarea
              id="note-content"
              placeholder="Scrivi qui il contenuto…"
            ></textarea>
            <input
              type="text"
              id="note-tags"
              placeholder="Tag, separati da virgola…"
            />

            <label class="modal-check-label">
              <input type="checkbox" id="is-task" />
              <span>È un impegno da completare</span>
            </label>
            <div id="task-completed-container" class="hidden">
              <label class="modal-check-label">
                <input type="checkbox" id="is-completed" />
                <span>Impegno completato</span>
              </label>
            </div>
          </div>
          <div class="modal-actions">
            <button id="delete-note" class="primary-button ghost-danger hidden">
              Elimina
            </button>
            <button id="close-modal" class="primary-button secondary">
              Annulla
            </button>
            <button id="save-note" class="primary-button">Salva nota</button>
          </div>
        </div>
      </div>

      <div id="confirm-modal" class="modal confirm-modal">
        <div class="modal-inner confirm-inner">
          <h3>Confermi l'eliminazione?</h3>
          <p id="confirm-message"></p>
          <div class="modal-actions confirm-actions">
            <button id="cancel-delete" class="primary-button secondary">
              Annulla
            </button>
            <button id="confirm-delete" class="primary-button ghost-danger">
              Elimina
            </button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast">
        <div id="toast-message"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
