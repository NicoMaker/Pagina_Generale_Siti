<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convertitore di Colori</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Convertitore di Colori</h1>
<div id="sw" aria-live="polite"></div>

<div class="card">
<div class="row">
<div><label for="pk">Selettore</label><input type="color" id="pk" value="#2a7de1"></div>
<div class="f"><label for="hex">HEX</label><input type="text" id="hex" maxlength="7" value="#2a7de1"></div>
</div>
<div class="row">
<div class="f"><label for="r">R</label><input type="number" id="r" min="0" max="255"></div>
<div class="f"><label for="g">G</label><input type="number" id="g" min="0" max="255"></div>
<div class="f"><label for="b">B</label><input type="number" id="b" min="0" max="255"></div>
</div>
<div class="row">
<div class="f"><label for="h">H (0–360)</label><input type="number" id="h" min="0" max="360"></div>
<div class="f"><label for="s">S %</label><input type="number" id="s" min="0" max="100"></div>
<div class="f"><label for="l">L %</label><input type="number" id="l" min="0" max="100"></div>
</div>
</div>

<div class="card">
<div class="out"><span id="oh"></span><button data-c="oh">Copia</button></div>
<div class="out"><span id="or"></span><button data-c="or">Copia</button></div>
<div class="out"><span id="ol"></span><button data-c="ol">Copia</button></div>
</div>

<div class="card">
<label>Contrasto del testo (WCAG)</label>
<div class="row">
<span class="chip" id="cw">Bianco</span><span id="rw"></span>
<span class="chip" id="cb" style="background:#000;color:#fff">Nero</span><span id="rb"></span>
</div>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
