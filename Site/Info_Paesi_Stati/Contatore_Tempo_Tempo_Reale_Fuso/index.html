<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#BFDDF2" />
    <title>Fusi orari | Orologio mondiale</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23262D80'/%3E%3Cpath d='M16 8v8l5 3' stroke='%23FFE7A3' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="layout">
      <!-- Pannello del cielo: cambia colore in base all'ora del fuso scelto -->
      <section class="sky" id="sky" data-phase="day" aria-labelledby="city">
        <div class="sky-inner">
          <p class="brand">Orologio mondiale</p>

          <div class="now">
            <div class="place">
              <h1 class="city" id="city">Roma</h1>
              <span class="utc" id="utc">UTC+0</span>
            </div>
            <div class="clock" id="clock" role="img" aria-label=""></div>
            <p class="date" id="date"></p>
          </div>

          <div class="delta" aria-live="polite">
            <p class="delta-value">
              <span id="delta-num">0</span>
              <span class="delta-unit" id="delta-unit">ore</span>
            </p>
            <div class="delta-text">
              <p id="delta-ref"></p>
              <p id="delta-day"></p>
            </div>
          </div>

          <div class="timeline" aria-hidden="true">
            <div class="tl-row">
              <div class="tl-label">
                <span id="me-label">Tu</span>
                <span class="tl-adesso">Adesso</span>
                <span class="tl-time" id="me-time">00:00</span>
              </div>
              <div class="tl-window">
                <div class="tl-track" id="track-me"></div>
              </div>
            </div>
            <div class="tl-row">
              <div class="tl-label">
                <span id="sel-label"></span>
                <span class="tl-time" id="sel-time">00:00</span>
              </div>
              <div class="tl-window">
                <div class="tl-track" id="track-sel"></div>
              </div>
            </div>
            <div class="tl-now"></div>
          </div>
        </div>
      </section>

      <!-- Elenco dei fusi orari -->
      <section class="picker" aria-labelledby="picker-title">
        <div class="picker-head">
          <h2 id="picker-title">Scegli un fuso orario</h2>
          <label class="search">
            <span class="sr-only">Cerca una città o un fuso UTC</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
            </svg>
            <input
              type="search"
              id="search"
              placeholder="Cerca città o UTC+2"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>

        <ul class="zone-list" id="zone-list"></ul>
        <p class="empty" id="empty" hidden>
          Nessun fuso trovato. Prova con il nome di una città o con un offset
          come UTC+2.
        </p>
      </section>
    </div>
  </body>
</html>
